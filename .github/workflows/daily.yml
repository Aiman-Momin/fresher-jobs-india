name: daily-refresh
on:
  schedule: [{cron: "30 0 * * *"}]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install -r requirements.txt
      - run: python -u pipeline.py
        env:
          ADZUNA_APP_ID: ${{ secrets.ADZUNA_APP_ID }}
          ADZUNA_APP_KEY: ${{ secrets.ADZUNA_APP_KEY }}
          TAG_API_KEY: ${{ secrets.TAG_API_KEY }}
      - run: |
          git config user.name "bot"; git config user.email "bot@users.noreply.github.com"
          git add docs data; git commit -m "daily refresh" || echo "nothing new"; git push